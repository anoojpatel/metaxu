name: Release

# Cutting a version, either way:
#
#   1. push a tag:   git tag -a v0.1.0 -m "Metaxu 0.1.0" && git push origin v0.1.0
#   2. or, in the Actions tab, "Run workflow" on main with version 0.1.0;
#      the workflow then creates the tag itself at that commit.
#
# Both paths check the version against pyproject, run the test suite
# and both example gates, build the wheel and sdist, and publish a
# GitHub Release with both attached, using the matching section of
# CHANGELOG.md as the notes.  The release page is what the website's
# Download button and the README point at; users install with
# `uv tool install <wheel url>` or `uv tool install git+...@v0.1.0`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (must match pyproject.toml)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the tag and check it against pyproject
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then tag="v$INPUT_VERSION"; else tag="$GITHUB_REF_NAME"; fi
          ver="${tag#v}"
          pyver="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$ver" != "$pyver" ]; then
            echo "release $tag does not match pyproject version $pyver" >&2
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VER=$ver" >> "$GITHUB_ENV"

      - name: Install
        run: uv sync --all-groups

      - name: Test suite
        run: uv run python -m pytest src/metaxu/compiler/tests -q -p no:cacheprovider

      - name: Example gates
        run: |
          uv run python scripts/run_examples.py
          uv run python scripts/run_examples.py --stage run

      - name: Build wheel and sdist
        run: uv build

      - name: Release notes from CHANGELOG.md
        run: |
          # the section between "## <ver>" and the next "## " heading
          awk -v ver="$VER" '
            /^## / { if (found) exit; found = ($2 == ver) ; next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "no CHANGELOG.md section for $VER" >&2
            exit 1
          fi
          {
            echo
            echo '## Install'
            echo
            echo '```bash'
            echo "uv tool install https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/metaxu-${VER}-py3-none-any.whl"
            echo "# or, from the tagged source:"
            echo "uv tool install git+https://github.com/${GITHUB_REPOSITORY}@${TAG}"
            echo '```'
            echo
            echo 'Needs Python 3.11+ and clang (for `metaxuc build`).'
          } >> notes.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target creates the tag at this commit when the run was
          # dispatched by hand; a pushed tag already exists and is reused.
          gh release create "$TAG" dist/* \
            --title "Metaxu $VER" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
