[project]
name = "metaxu"
version = "0.1.0"
description = "A systems language with algebraic effects, mode-based memory safety and tile-level GPU kernels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beartype>=0.19.0",
    "doit>=0.36.0",
    "ply>=3.11",
]

[project.urls]
Homepage = "https://metaxulang.org"
Repository = "https://github.com/anoojpatel/metaxu"

[project.scripts]
metaxu = "metaxu.metaxu:main"
metaxuc = "metaxu.compiler.cli:main"
tap = "metaxu.tap.cli:main"

[dependency-groups]
dev = [
    "pylsp-mypy>=0.6.9",
    "pytest>=8.3.3",
    "python-lsp-server>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The wheel is what `uv tool install` and `uvx` run. It carries the
# Python package, the C runtime sources (built on first use next to the
# package) and a copy of the standard library, which lives at the
# repository root as std/ and is found by module_loader._stdlib_dir at
# metaxu/std/ inside an installed package. Build products and caches
# from a developer's checkout must not ship.
[tool.hatch.build.targets.wheel]
packages = ["src/metaxu"]
exclude = [
    "src/metaxu/runtime/native/_build",
    "src/metaxu/parser.out",
    "src/metaxu/parsetab.py",
    "**/__pycache__",
    "**/tests",
]

[tool.hatch.build.targets.wheel.force-include]
"std" = "metaxu/std"

[tool.hatch.build.targets.sdist]
include = ["src/metaxu", "std", "README.md", "pyproject.toml"]
exclude = ["src/metaxu/runtime/native/_build", "**/__pycache__", "src/metaxu/parser.out", "src/metaxu/parsetab.py"]
